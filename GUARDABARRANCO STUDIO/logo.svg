<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="birdBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#023E8A" />
    </linearGradient>
    <linearGradient id="birdGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <linearGradient id="birdGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC4B6" />
      <stop offset="100%" stop-color="#05668D" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#0056B3" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0077B6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark (Guardabarranco Stylized Emblem) -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <!-- Sun aura halo (warm nica sunset) -->
    <circle cx="52" cy="52" r="48" fill="#FFF9E6" stroke="#FFE3A8" stroke-width="1.5" />
    
    <!-- Stylized volcanic crest behind bird -->
    <path d="M 20 82 L 42 56 L 56 68 L 74 48 L 88 82 Z" fill="#E8EDF5" opacity="0.6"/>

    <!-- Bird Body & Wings (Vibrant Guardabarranco geometry) -->
    <!-- Belly (Rufous Orange) -->
    <path d="M 45 42 Q 58 56 50 78 Q 40 74 38 60 Z" fill="url(#birdGoldGrad)" />

    <!-- Back & Wing (Emerald & Cyan Green) -->
    <path d="M 42 36 Q 30 52 34 76 Q 42 66 45 42 Z" fill="url(#birdGreenGrad)" />

    <!-- Upper Wing Feather (Teal Blue) -->
    <path d="M 37 45 C 24 58 26 78 30 82 C 34 78 38 66 38 52 Z" fill="url(#birdBlueGrad)" />

    <!-- Crown & Head (Cyan Turquoise) -->
    <path d="M 43 36 C 45 28 54 26 62 30 C 65 34 62 42 54 44 Z" fill="url(#birdGreenGrad)" />

    <!-- Turquoise Eyebrow Stripe -->
    <path d="M 48 30 Q 56 31 63 33" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Black eye mask -->
    <path d="M 52 34 Q 58 35 62 36 L 58 38 Z" fill="#0A1128" />
    <circle cx="56" cy="34.5" r="1.5" fill="#FFFFFF" />

    <!-- Beak -->
    <path d="M 62 33 L 74 38 L 61 40 Z" fill="#1B263B" />

    <!-- Signature Racket Tail Feathers (Guardabarranco's iconic twin paddles) -->
    <!-- Shaft 1 -->
    <path d="M 44 76 Q 46 92 48 100" stroke="#0A2540" stroke-width="1.5" fill="none" />
    <!-- Paddle 1 -->
    <ellipse cx="49" cy="102" rx="4.5" ry="6.5" fill="url(#birdBlueGrad)" transform="rotate(12 49 102)" />
    <circle cx="49" cy="103" r="2" fill="#0A1128" />

    <!-- Shaft 2 -->
    <path d="M 40 76 Q 39 92 36 98" stroke="#0A2540" stroke-width="1.5" fill="none" />
    <!-- Paddle 2 -->
    <ellipse cx="35" cy="101" rx="4.5" ry="6.5" fill="url(#birdGreenGrad)" transform="rotate(-15 35 101)" />
    <circle cx="35" cy="102" r="2" fill="#0A1128" />

    <!-- Orbit ring segment -->
    <path d="M 78 28 A 48 48 0 0 1 88 64" fill="none" stroke="#FB8500" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 6" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="34" font-weight="900" letter-spacing="1.2" fill="url(#textGrad)">
      GUARDABARRANCO
    </text>

    <!-- Studio with accent -->
    <text x="350" y="44" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="34" font-weight="400" letter-spacing="3" fill="#00A896">
      STUDIO
    </text>

    <!-- Subtitle & Identity -->
    <text x="2" y="70" font-family="'Inter', 'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="4.5" fill="#64748B">
      MARKETING &#8226; PUBLICIDAD &#8226; ESTRATEGIA DIGITAL
    </text>

    <!-- Regional Badge Pill -->
    <g transform="translate(2, 79)">
      <rect x="0" y="0" width="248" height="18" rx="9" fill="#E6F7F5" />
      <circle cx="10" cy="9" r="4" fill="#00A896" />
      <text x="20" y="13" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#006657">
        NICARAGUA &#8226; ALCANCE CENTROAMERICANO
      </text>
    </g>
  </g>
</svg>
