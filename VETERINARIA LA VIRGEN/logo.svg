<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra suave -->
    <filter id="shadowVet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0E354F" flood-opacity="0.15" />
    </filter>

    <style>
      .logo-blue { fill: none; stroke: #154B80; stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; }
      .logo-green { fill: none; stroke: #237A3B; stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; }
      .logo-brown { fill: none; stroke: #784421; stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round; }
      .text-title-vet { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 52px; fill: #784421; letter-spacing: 8px; }
      .text-sub-vet { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; font-weight: 900; font-size: 62px; fill: #784421; letter-spacing: 12px; }
      .text-doctor-vet { font-family: 'Inter', Arial, sans-serif; font-weight: 700; font-size: 19px; fill: #237A3B; letter-spacing: 4px; }
      .text-loc-vet { font-family: 'Inter', Arial, sans-serif; font-weight: 600; font-size: 14.5px; fill: #154B80; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Grupo del Emblema de Siluetas de Animales -->
  <g transform="translate(10, 10)" filter="url(#shadowVet)">
    <!-- 1. CABALLO (AZUL - Parte superior e izquierda) -->
    <!-- Frente, quijada, hocico y orejas -->
    <path class="logo-blue" d="M 290 160 C 280 130, 295 85, 310 78 C 319 74, 325 90, 323 102 C 333 85, 350 78, 357 88 C 361 96, 353 118, 345 135" />
    <path class="logo-blue" d="M 310 78 C 293 105, 280 128, 273 150 C 265 168, 240 180, 250 208 C 257 220, 275 224, 287 214 C 303 202, 310 180, 323 172 C 339 165, 360 185, 371 218 C 383 255, 375 295, 359 330" />
    <!-- Crin elegante del caballo -->
    <path class="logo-blue" d="M 345 115 C 363 128, 369 150, 357 172" />
    <path class="logo-blue" d="M 353 150 C 380 168, 385 200, 369 235" />
    <path class="logo-blue" d="M 363 195 C 390 220, 387 258, 371 280" />

    <!-- 2. VACA (VERDE - Parte superior derecha) -->
    <!-- Oreja, cuerno, testuz y lomo de vaca -->
    <path class="logo-green" d="M 430 105 C 423 92, 411 86, 405 98 C 413 106, 421 114, 423 128 C 405 130, 381 138, 377 155 C 375 172, 393 184, 417 184 C 441 184, 459 166, 477 160 C 495 154, 513 166, 507 190 C 501 208, 471 220, 453 222" />
    <path class="logo-green" d="M 430 105 C 447 82, 477 84, 483 112 C 471 116, 453 112, 445 124 C 465 120, 495 128, 513 142 C 519 148, 513 160, 501 160" />
    <path class="logo-green" d="M 453 222 C 477 226, 513 244, 525 280" />

    <!-- 3. OVEJA / PELIBUEY (AZUL - Lado derecho) -->
    <path class="logo-blue" d="M 485 275 C 473 258, 497 240, 515 246 C 527 234, 551 240, 555 258 C 569 252, 587 268, 581 284 C 595 292, 593 316, 575 320 C 581 336, 563 350, 545 346 C 533 358, 507 354, 499 340" />
    <path class="logo-blue" d="M 555 264 C 569 272, 571 288, 559 300 C 547 312, 533 308, 530 294" />
    <path class="logo-blue" d="M 563 280 C 575 282, 581 294, 575 304" />

    <!-- 4. CERDO (AZUL - Lado izquierdo) -->
    <!-- Cabeza, lomo, hocico y patas de cerdo -->
    <path class="logo-blue" d="M 285 300 C 260 294, 235 306, 223 324 C 211 342, 193 354, 181 360 C 193 372, 211 372, 223 378 C 229 388, 241 390, 247 384 C 247 402, 247 420, 247 432 C 259 432, 271 432, 275 420 C 283 420, 289 432, 299 432 C 307 432, 307 414, 307 402" />
    <!-- Orejas de cerdito -->
    <path class="logo-blue" d="M 223 324 C 223 306, 239 300, 247 318" />
    <path class="logo-blue" d="M 247 312 C 259 296, 275 304, 271 324" />
    <circle cx="235" cy="342" r="3.5" fill="#154B80" />

    <!-- 5. PERRO (AZUL - Centro derecha) -->
    <path class="logo-blue" d="M 405 275 C 393 262, 411 250, 429 254 C 445 256, 453 275, 449 292 C 461 292, 477 302, 471 316 C 461 326, 445 322, 435 316" />
    <!-- Oreja caída del perro -->
    <path class="logo-blue" d="M 429 256 C 413 268, 409 298, 417 318" />
    <!-- Cuerpo y patas de perro sentado -->
    <path class="logo-blue" d="M 445 318 C 453 352, 465 382, 495 400 C 513 412, 507 430, 483 430 C 459 430, 447 406, 441 388 C 435 406, 429 430, 413 430 C 405 430, 405 406, 409 376 C 399 394, 387 412, 375 430" />

    <!-- 6. GATO (CAFÉ - Centro inferior entre cerdo y perro) -->
    <path class="logo-brown" d="M 347 352 C 341 336, 351 328, 355 336 C 363 324, 371 332, 367 346 C 377 356, 383 376, 379 400 C 377 418, 383 432, 371 436 C 359 436, 353 424, 351 406 C 347 424, 335 436, 327 436 C 317 436, 317 418, 323 394 C 329 370, 339 358, 347 352 Z" />
    <path class="logo-brown" d="M 329 418 C 323 394, 335 376, 347 382" />
  </g>

  <!-- TIPOGRAFÍA OFICIAL DEL LOGO COMPLETO Y MEJORADO -->
  <text x="360" y="475" text-anchor="middle" class="text-title-vet">VETERINARIA</text>
  <text x="360" y="525" text-anchor="middle" class="text-sub-vet">LA VIRGEN</text>
  <text x="360" y="556" text-anchor="middle" class="text-doctor-vet">DR. JUNIOR ELIAN VILLALOBOS &#8226; MÉDICO VETERINARIO</text>
  <text x="360" y="580" text-anchor="middle" class="text-loc-vet">EL VIEJO, CHINANDEGA &#8226; CARRETERA POTOSÍ (VIRGEN DEL HATO 200M NORTE)</text>
</svg>
