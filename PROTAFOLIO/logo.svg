<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logo Corporativo Ing. Luis Enrique Albares Soriano">
  <!-- Fondo cuadrado sólido corporativo plano -->
  <rect x="4" y="4" width="112" height="112" rx="10" fill="#0F172A" />
  <rect x="10" y="10" width="100" height="100" rx="6" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Letra L geométrica -->
  <path
    d="M32 34 V78 H54"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Letra A geométrica -->
  <path
    d="M60 78 L75 34 L90 78"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
  <line
    x1="65"
    y1="62"
    x2="85"
    y2="62"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="butt"
  />

  <!-- Línea horizontal corporativa plana en Azul Institucional -->
  <rect x="32" y="88" width="58" height="4" fill="#2563EB" />
</svg>
