<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%">
  <defs>
    <!-- Silver Metallic Gradients -->
    <linearGradient id="silverBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="silverDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="chromeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Geometric Engineering Isometric Emblem -->
  <g transform="translate(14, 12)" filter="url(#silverGlow)">
    <!-- Outer Octagon / Precision Hex Frame -->
    <polygon points="48,4 84,24 84,72 48,92 12,72 12,24" fill="#090A0F" stroke="url(#silverBright)" stroke-width="2.5" />
    
    <!-- Inner faceted geometry (representing code brackets & dimensional architecture) -->
    <!-- Top left facet -->
    <polygon points="48,12 80,30 48,48 16,30" fill="url(#silverBright)" opacity="0.9" />
    <!-- Bottom left facet -->
    <polygon points="16,32 48,50 48,84 16,66" fill="url(#silverDark)" />
    <!-- Bottom right facet -->
    <polygon points="48,50 80,32 80,66 48,84" fill="url(#silverBright)" opacity="0.75" />

    <!-- Center Code Core (Bracket Chevron in pure white) -->
    <path d="M 38 42 L 30 48 L 38 54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 58 42 L 66 48 L 58 54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="52" y1="40" x2="44" y2="56" stroke="url(#chromeAccent)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Precision micro-dots -->
    <circle cx="48" cy="4" r="2.5" fill="#FFFFFF" />
    <circle cx="84" cy="24" r="2" fill="#94A3B8" />
    <circle cx="84" cy="72" r="2" fill="#94A3B8" />
    <circle cx="48" cy="92" r="2.5" fill="#FFFFFF" />
    <circle cx="12" cy="72" r="2" fill="#94A3B8" />
    <circle cx="12" cy="24" r="2" fill="#94A3B8" />
  </g>

  <!-- Typography: Dev Studio -->
  <g transform="translate(125, 20)">
    <!-- "DEV" -->
    <text x="0" y="44" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#FFFFFF">
      DEV
    </text>

    <!-- "STUDIO" in Platinum Metallic -->
    <text x="100" y="44" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="300" letter-spacing="4" fill="url(#silverBright)">
      STUDIO
    </text>

    <!-- Subtitle -->
    <text x="2" y="70" font-family="'Space Grotesk', 'Inter', monospace" font-size="11.5" font-weight="600" letter-spacing="4" fill="#94A3B8">
      CUSTOM SOFTWARE ENGINEERING &#8226; CLOUD &#8226; ARCHITECTURE
    </text>

    <!-- Tech Indicator Pill -->
    <g transform="translate(2, 79)">
      <rect x="0" y="0" width="230" height="18" rx="4" fill="#141822" stroke="#334155" stroke-width="1" />
      <circle cx="9" cy="9" r="3.5" fill="#E2E8F0" />
      <text x="18" y="13" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="9" font-weight="600" letter-spacing="1.5" fill="#CBD5E1">
        HIGH-PERFORMANCE ENTERPRISE
      </text>
    </g>
  </g>
</svg>
